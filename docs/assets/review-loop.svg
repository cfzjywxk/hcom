<svg xmlns="http://www.w3.org/2000/svg" width="980" height="624" viewBox="0 0 980 624" role="img" aria-labelledby="t d">
<title id="t">hcom review loop across two terminal windows</title>
<desc id="d">A developer agent in one terminal starts hcom review; hcom delivers structured review messages to a reviewer agent in another terminal and back, alternating awaiting_review and awaiting_developer until LGTM, the round limit, or cancel.</desc>
<defs><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker><marker id="arr-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="623" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="28" y="32" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" text-anchor="start" font-weight="600" xml:space="preserve"><tspan fill="#e6edf3">hcom review  —  two agents, two windows, one loop</tspan></text>
<text x="28" y="50" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">One human prompt starts it. Hooks deliver every structured message and wake the idle peer, so the loop advances by itself.</tspan></text>
<rect x="28" y="66" width="404" height="282" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="28" y="66" width="404" height="26" rx="8" fill="#1c2129"/>
<rect x="28" y="80" width="404" height="12" rx="0" fill="#1c2129"/>
<line x1="28" y1="92" x2="432" y2="92" stroke="#30363d" stroke-width="1"/>
<circle cx="42" cy="79" r="5" fill="#ff5f57"/>
<circle cx="58" cy="79" r="5" fill="#febc2e"/>
<circle cx="74" cy="79" r="5" fill="#28c840"/>
<text x="90" y="83" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">Terminal 1 · hcom claude · luna (developer)</tspan></text>
<rect x="548" y="66" width="404" height="282" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="548" y="66" width="404" height="26" rx="8" fill="#1c2129"/>
<rect x="548" y="80" width="404" height="12" rx="0" fill="#1c2129"/>
<line x1="548" y1="92" x2="952" y2="92" stroke="#30363d" stroke-width="1"/>
<circle cx="562" cy="79" r="5" fill="#ff5f57"/>
<circle cx="578" cy="79" r="5" fill="#febc2e"/>
<circle cx="594" cy="79" r="5" fill="#28c840"/>
<text x="610" y="83" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">Terminal 2 · hcom codex · kova (reviewer)</tspan></text>
<text x="40" y="108" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#58a6ff">you › </tspan><tspan fill="#e6edf3">ask kova to review my change, keep fixing</tspan></text>
<text x="40" y="125" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#e6edf3">      until LGTM, at most 3 rounds</tspan></text>
<text x="40" y="142" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">hcom review start @kova --max-rounds 3 \</tspan></text>
<text x="40" y="159" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#e6edf3">    --name luna -- &#x27;review: fix nil deref&#x27;</tspan></text>
<text x="40" y="176" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">  rv-3f9a started · waiting for delivery …</tspan></text>
<text x="40" y="210" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#d29922">[hcom-review rv-3f9a | round 1/3 | awaiting_developer]</tspan></text>
<text x="40" y="227" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">  Reviewer requested changes: nil guard missing …</tspan></text>
<text x="40" y="244" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">hcom review fixed rv-3f9a --round 1 --name luna \</tspan></text>
<text x="40" y="261" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#e6edf3">    -- &#x27;added nil guard + regression test&#x27;</tspan></text>
<text x="40" y="278" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">  waiting for delivery …</tspan></text>
<text x="40" y="312" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#3fb950">[hcom-review rv-3f9a | round 2/3 | approved]  ✓</tspan></text>
<text x="40" y="329" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">  Report completion to the user.</tspan></text>
<text x="560" y="108" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#bc8cff">kova › </tspan><tspan fill="#8b949e">idle — nothing to do yet</tspan></text>
<text x="560" y="142" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#58a6ff">[hcom-review rv-3f9a | round 1/3 | awaiting_review]</tspan></text>
<text x="560" y="159" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">  Role: reviewer. Review the change; do not modify it.</tspan></text>
<text x="560" y="176" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">hcom review verdict rv-3f9a --round 1 --name kova \</tspan></text>
<text x="560" y="193" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#e6edf3">    --request-changes -- &#x27;nil guard missing in parse()&#x27;</tspan></text>
<text x="560" y="210" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">  waiting for delivery …</tspan></text>
<text x="560" y="244" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#58a6ff">[hcom-review rv-3f9a | round 2/3 | awaiting_review]</tspan></text>
<text x="560" y="261" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">  Submission: added nil guard + regression test</tspan></text>
<text x="560" y="278" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">hcom review verdict rv-3f9a --round 2 --name kova \</tspan></text>
<text x="560" y="295" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#e6edf3">    --lgtm -- &#x27;LGTM&#x27;</tspan></text>
<text x="560" y="312" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">  review loop complete</tspan></text>
<line x1="436" y1="155" x2="544" y2="138" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<text x="490.0" y="130" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve"><tspan fill="#58a6ff">round 1</tspan></text>
<line x1="544" y1="189" x2="436" y2="206" stroke="#d29922" stroke-width="1.4" marker-end="url(#arr-amber)"/>
<text x="490.0" y="181" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve"><tspan fill="#d29922">wakes luna</tspan></text>
<line x1="436" y1="257" x2="544" y2="240" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<text x="490.0" y="232" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve"><tspan fill="#58a6ff">round 2</tspan></text>
<line x1="544" y1="291" x2="436" y2="308" stroke="#3fb950" stroke-width="1.4" marker-end="url(#arr-green)"/>
<text x="490.0" y="283" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve"><tspan fill="#3fb950">LGTM</tspan></text>
<text x="28" y="386" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="start" font-weight="600" letter-spacing="1.2" xml:space="preserve"><tspan fill="#8b949e">STATE MACHINE</tspan></text>
<text x="140" y="386" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">only structured  hcom review …  commands move it — plain chat never does</tspan></text>
<rect x="100" y="408" width="160" height="32" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
<text x="180.0" y="429.75" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan fill="#58a6ff">awaiting_review</tspan></text>
<rect x="470" y="408" width="170" height="32" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.3"/>
<text x="555.0" y="429.75" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan fill="#d29922">awaiting_developer</tspan></text>
<rect x="40" y="526" width="140" height="32" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/>
<text x="110.0" y="547.75" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan fill="#3fb950">approved</tspan></text>
<rect x="230" y="526" width="140" height="32" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.3"/>
<text x="300.0" y="547.75" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan fill="#f85149">max_rounds</tspan></text>
<rect x="770" y="466" width="130" height="32" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="835.0" y="487.75" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan fill="#8b949e">canceled</tspan></text>
<line x1="260" y1="418" x2="470" y2="418" stroke="#d29922" stroke-width="1.4" marker-end="url(#arr-amber)"/>
<text x="365" y="404" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve"><tspan fill="#d29922">verdict --request-changes</tspan></text>
<line x1="470" y1="432" x2="260" y2="432" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<text x="365" y="460" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve"><tspan fill="#58a6ff">fixed | rebut   →  round + 1</tspan></text>
<line x1="150" y1="440" x2="115" y2="526" stroke="#3fb950" stroke-width="1.4" marker-end="url(#arr-green)"/>
<text x="96" y="488" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="10" text-anchor="end" font-weight="normal" xml:space="preserve"><tspan fill="#3fb950">verdict --lgtm</tspan></text>
<line x1="210" y1="440" x2="295" y2="526" stroke="#f85149" stroke-width="1.4" marker-end="url(#arr-red)"/>
<text x="262" y="488" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="10" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#f85149">request-changes at round N/N</tspan></text>
<path d="M370,542 C 480,542 520,478 555,442" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#arr-muted)"/>
<text x="478" y="560" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">extend --max-rounds</tspan></text>
<line x1="640" y1="424" x2="770" y2="482" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-muted)"/>
<text x="712" y="440" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="10" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">cancel — either side, any state</tspan></text>
<text x="28" y="600" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" font-weight="normal" xml:space="preserve"><tspan fill="#8b949e">Works between any two local top-level Claude Code / Codex agents launched by hcom, in separate windows or panes.   hcom review --help</tspan></text>
</svg>
